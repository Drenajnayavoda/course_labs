name: DevSecOps Pipeline (lab09)

# ВНИМАНИЕ: этот файл — копия по спецификации лабораторной работы,
# показывает как пайплайн выглядит в собственном репозитории лабы.
# Фактически в данном репозитории course_labs пайплайн запускается
# из .github/workflows/devsecops-lab09.yml (корень репозитория, с
# correct working-directory), потому что GitHub Actions берёт
# workflow-файлы только из корневой .github/workflows/.

on:
  push:
    branches: [develop, main]
    paths:
      - "labs/basic/lab09/**"
  pull_request:
    branches: [main]
    paths:
      - "labs/basic/lab09/**"

env:
  IMAGE_NAME: lab09-app
  APP_PORT: 8080

jobs:

  sast:
    name: "SAST — Semgrep + Checkov"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install semgrep checkov

      - name: Semgrep scan
        run: |
          semgrep \
            --config pipeline/sast/semgrep-rules.yml \
            --json \
            --output pipeline/sast/semgrep-report.json \
            app/ || true

      - name: Checkov scan
        run: |
          checkov \
            --framework dockerfile \
            --file app/Dockerfile docker-compose.yml \
            --output json \
            --output-file-path pipeline/sast/ \
            --soft-fail
          mv pipeline/sast/results_json.json pipeline/sast/checkov-report.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: pipeline/sast/

  sca:
    name: "SCA — Dependency-Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "lab09-vulnerable-app"
          path: "app"
          format: "JSON"
          out: "pipeline/sca"
          args: >-
            --failOnCVSS 9
            --enableExperimental

      - uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: pipeline/sca/

  build-and-scan:
    name: "Build + Trivy Image Scan"
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} app/

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: json
          output: pipeline/trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: "0"

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: pipeline/trivy-report.json

  dast:
    name: "DAST — OWASP ZAP"
    runs-on: ubuntu-latest
    needs: build-and-scan
    steps:
      - uses: actions/checkout@v4

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for app readiness
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:${{ env.APP_PORT }} && break
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:${{ env.APP_PORT }}"
          rules_file_name: "pipeline/dast/zap-baseline.conf"
          cmd_options: "-J zap-report.json -r zap-report.html"
          fail_action: false

      - name: Stop application
        if: always()
        run: docker compose down || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-reports
          path: |
            zap-report.json
            zap-report.html

  report:
    name: "Unified Report"
    runs-on: ubuntu-latest
    needs: [sast, sca, build-and-scan, dast]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: pipeline/artifacts/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install jinja2

      - name: Merge reports
        run: python pipeline/merge_reports.py

      - uses: actions/upload-artifact@v4
        with:
          name: unified-report
          path: pipeline/unified-report.html
