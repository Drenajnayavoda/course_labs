app:
  name: "lab07-vulnerable-app"
  environment: "production"
  debug: false
  verbose_logging: false

server:
  host: "0.0.0.0"
  port: 8080
  enable_metrics: false
  allow_origin: "https://example.com"

database:
  engine: "sqlite"
  host: "localhost"
  port: 5432
  name: "vuln_db"
  user: "admin"
  password: "${DB_PASSWORD}"   # получать из переменных окружения
  pool_size: 10
  debug_queries: false

security:
  allow_registration: true
  default_admin_user: "admin"
  default_admin_password: "${DEFAULT_ADMIN_PASSWORD}" # env var
  jwt_secret: "${JWT_SECRET}"   # env var
  jwt_algorithm: "HS256"
  enable_csrf_protection: true
  enable_rate_limit: true
  allow_insecure_cookies: false
  session_cookie_secure: true
  session_cookie_httponly: true

logging:
  level: "INFO"
  log_sql: false
  log_sensitive: false
  log_file: "app-debug.log"

features:
  enable_experimental_api: false
  enable_unsafe_eval: false
  enable_remote_shell: false

integrations:
  debug_webhook_url: ""
  enable_unsafe_webhooks: false
  trusted_proxies:
    - "127.0.0.1/32"
