name: DevSecOps Pipeline (lab09)

on:
  push:
    branches: [develop, main]
    paths:
      - "labs/basic/lab09/**"
      - ".github/workflows/devsecops-lab09.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "labs/basic/lab09/**"
      - ".github/workflows/devsecops-lab09.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: lab09-app
  APP_PORT: 8080
  LAB_DIR: labs/basic/lab09

jobs:

  sast:
    name: "SAST — Semgrep + Checkov"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/basic/lab09
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install --upgrade pip && pip install semgrep checkov

      - name: Semgrep scan
        run: |
          mkdir -p pipeline/sast
          semgrep \
            --config pipeline/sast/semgrep-rules.yml \
            --json \
            --output pipeline/sast/semgrep-report.json \
            app/ || true
          echo "--- semgrep summary ---"
          semgrep \
            --config pipeline/sast/semgrep-rules.yml \
            app/ || true

      - name: Checkov scan
        run: |
          set +e
          checkov \
            --framework dockerfile \
            --file app/Dockerfile \
            --output json > pipeline/sast/checkov-report.json
          rc=$?
          echo "checkov exit=$rc"
          checkov \
            --framework dockerfile \
            --file app/Dockerfile || true
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: labs/basic/lab09/pipeline/sast/

  sca:
    name: "SCA — Dependency-Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('labs/basic/lab09/app/requirements.txt') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: "lab09-vulnerable-app"
          path: "labs/basic/lab09/app"
          format: "ALL"
          out: "labs/basic/lab09/pipeline/sca"
          args: >-
            --enableExperimental
            --failOnCVSS 11
            --nvdApiDelay 6000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-reports
          path: labs/basic/lab09/pipeline/sca/

  build-and-scan:
    name: "Build + Trivy Image Scan"
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" "$LAB_DIR/app"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: json
          output: labs/basic/lab09/pipeline/trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Trivy summary (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: labs/basic/lab09/pipeline/trivy-report.json

  dast:
    name: "DAST — OWASP ZAP"
    runs-on: ubuntu-latest
    needs: build-and-scan
    steps:
      - uses: actions/checkout@v4

      - name: Start application
        working-directory: labs/basic/lab09
        run: docker compose up -d --build

      - name: Wait for app readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${APP_PORT}/" >/dev/null; then
              echo "app is up"
              break
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: "http://localhost:${{ env.APP_PORT }}"
          rules_file_name: "labs/basic/lab09/pipeline/dast/zap-baseline.conf"
          fail_action: true
          allow_issue_writing: false

      - name: Stop application
        if: always()
        working-directory: labs/basic/lab09
        run: docker compose down || true

      - name: Collect ZAP reports
        if: always()
        run: |
          mkdir -p dast-out
          for src in report_json.json report_html.html report_md.md; do
            [ -f "$src" ] && cp -v "$src" "dast-out/$(echo $src | sed 's/^report_/zap-report./;s/\.\(json\|html\|md\)\(\.json\|\.html\|\.md\)/\1\2/')" || true
          done
          # fallback simpler naming
          [ -f report_json.json ] && cp -v report_json.json dast-out/zap-report.json
          [ -f report_html.html ] && cp -v report_html.html dast-out/zap-report.html
          [ -f report_md.md ]     && cp -v report_md.md     dast-out/zap-report.md
          echo "--- dast-out contents ---"
          ls -la dast-out/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-reports
          path: dast-out/

  report:
    name: "Unified Report"
    runs-on: ubuntu-latest
    needs: [sast, sca, build-and-scan, dast]
    if: always()
    defaults:
      run:
        working-directory: labs/basic/lab09
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: labs/basic/lab09/pipeline/artifacts/

      - name: Show what we downloaded
        run: ls -la pipeline/artifacts/ && find pipeline/artifacts/ -maxdepth 3 -type f

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install jinja2

      - name: Merge reports
        run: python pipeline/merge_reports.py

      - uses: actions/upload-artifact@v4
        with:
          name: unified-report
          path: labs/basic/lab09/pipeline/unified-report.html
